<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOP CATALOG</title>
  <style>
    /* 全体設定 */
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #2b6cb0;
      --tag-bg: #e2e8f0;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px 15px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    header p {
      font-size: 0.9rem;
      color: #666;
    }

    /* フィルタータブ */
    .filter-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    /* グリッドレイアウト */
    .catalog-grid {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    /* 商品カード */
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .item-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
    }

    .item-card.hidden {
      display: none;
    }

    .thumbnail-container {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #edf2f7;
      position: relative;
    }

    .thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--accent-color);
      color: #fff;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .item-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .item-title {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .item-desc {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 12px;
      flex-grow: 1;
    }

    .item-price {
      font-size: 1.05rem;
      font-weight: bold;
      color: #e53e3e;
      margin-bottom: 12px;
    }

    .buy-button {
      display: block;
      text-align: center;
      background: var(--text-color);
      color: #fff;
      text-decoration: none;
      padding: 8px 0;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      transition: background 0.2s ease;
    }

    .buy-button:hover {
      background: var(--accent-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>マイショップ カタログ</h1>
    <p>画像をクリックするとPictSPACEの頒布ページへ移動します</p>
  </header>

  <!-- カテゴリ切り替えボタン -->
  <div class="filter-container">
    <button class="filter-btn active" onclick="filterItems('all')">すべて</button>
    <button class="filter-btn" onclick="filterItems('book')">同人誌</button>
    <button class="filter-btn" onclick="filterItems('digital')">DL素材</button>
    <button class="filter-btn" onclick="filterItems('goods')">グッズ</button>
  </div>

  <!-- 商品一覧グリッド -->
  <div class="catalog-grid">

    <!-- 商品カード1 -->
    <div class="item-card" data-category="book">
      <div class="thumbnail-container">
        <span class="badge">NEW</span>
        <img src="https://via.placeholder.com/300x300?text=Item+Image+1" alt="商品画像">
      </div>
      <div class="item-info">
        <div class="item-title">新刊イラスト集「TITLE」</div>
        <div class="item-desc">A4 / 24P / フルカラー。描き下ろしイラストを多数収録。</div>
        <div class="item-price">¥1,000</div>
        <a href="https://pictspace.net/items/detail/XXXXXX" target="_blank" class="buy-button">ピクスペで購入</a>
      </div>
    </div>

    <!-- 商品カード2 -->
    <div class="item-card" data-category="digital">
      <div class="thumbnail-container">
        <img src="https://via.placeholder.com/300x300?text=Item+Image+2" alt="商品画像">
      </div>
      <div class="item-info">
        <div class="item-title">3Dモデル・背景素材セット</div>
        <div class="item-desc">FBX / OBJ形式。イラスト・商用利用OKな汎用背景。</div>
        <div class="item-price">¥500</div>
        <a href="https://pictspace.net/items/detail/XXXXXX" target="_blank" class="buy-button">ピクスペで購入</a>
      </div>
    </div>

    <!-- 商品カード3 -->
    <div class="item-card" data-category="goods">
      <div class="thumbnail-container">
        <img src="https://via.placeholder.com/300x300?text=Item+Image+3" alt="商品画像">
      </div>
      <div class="item-info">
        <div class="item-title">アクリルスタンド</div>
        <div class="item-desc">約70mm×70mm / 台座付き。</div>
        <div class="item-price">¥800</div>
        <a href="https://pictspace.net/items/detail/XXXXXX" target="_blank" class="buy-button">ピクスペで購入</a>
      </div>
    </div>

  </div>

  <script>
    // 絞り込み用JavaScript
    function filterItems(category) {
      // ボタンのアクティブ化
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');

      // カードの表示/非表示切り替え
      const cards = document.querySelectorAll('.item-card');
      cards.forEach(card => {
        if (category === 'all' || card.getAttribute('data-category') === category) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }
  </script>

</body>
</html>
