<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ほうじ茶の同人CG店</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- ヘッダー：お店の名前 ＆ SNSリンク -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight text-slate-900 mb-2">🍵 ほうじ茶の同人CG店</h1>
            <p class="text-slate-500 text-sm mb-4">デジタルコンテンツ特設カタログ</p>
            
            <div class="flex items-center justify-center gap-3">
                <a href="https://x.com/gomikasu_pipo" target="_blank" rel="noopener noreferrer" class="px-3.5 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-semibold hover:bg-slate-800 transition flex items-center gap-1.5 shadow-sm">
                    𝕏 Twitter
                </a>
                <a href="https://www.pixiv.net/users/10982318" target="_blank" rel="noopener noreferrer" class="px-3.5 py-1.5 rounded-xl bg-blue-600 text-white text-xs font-semibold hover:bg-blue-500 transition flex items-center gap-1.5 shadow-sm">
                    🎨 pixiv
                </a>
                <a href="https://discord.gg/PPHgePZqPK" target="_blank" rel="noopener noreferrer" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-500 transition flex items-center gap-1.5 shadow-sm">
                    💬 Discord
                </a>
            </div>
        </header>

        <!-- 検索窓 & メインカテゴリフィルター -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <!-- 検索窓 -->
            <div class="w-full md:w-72">
                <input type="text" id="search-input" placeholder="キーワードで検索..." oninput="filterProducts()" 
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-rose-500 transition">
            </div>

            <!-- メインカテゴリボタン -->
            <div id="main-filter-buttons" class="flex flex-wrap gap-2">
                <button onclick="setMainCategory('all')" class="main-btn active px-3.5 py-2 rounded-xl text-xs font-semibold bg-rose-500 text-white transition">すべて</button>
                <button onclick="setMainCategory('precure')" class="main-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">プリキュア</button>
                <button onclick="setMainCategory('symphogear')" class="main-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">シンフォギア</button>
                <button onclick="setMainCategory('aikatsu')" class="main-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">アイカツ</button>
                <button onclick="setMainCategory('genshin')" class="main-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">原神</button>
                <button onclick="setMainCategory('vtuber')" class="main-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">VTuber</button>
                <button onclick="setMainCategory('toloveru')" class="main-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">To LOVEる</button>
                <button onclick="setMainCategory('other')" class="main-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">その他</button>
            </div>
        </div>

        <!-- サブカテゴリ（細分化）フィルターバー -->
        <div id="sub-filter-container" class="flex flex-wrap gap-2 mb-8 min-h-[38px] items-center">
            <!-- 動的生成 -->
        </div>

        <!-- ローディング表示 -->
        <div id="loading" class="text-center py-20 text-slate-400 font-medium">
            データを読み込んでいます...
        </div>

        <!-- 商品カードグリッド -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzVJ8s7jV0r7blLD1Q9qmKO9RLxtr7JTIegI_iEMysOBKysfNdCReOrAHml3I9Baymw1w/exec";
        let allProducts = [];
        let currentMainCategory = 'all';
        let currentSubCategory = 'all';

        const subCategoryNames = {
            'mahotsukai': '魔法つかいプリキュア！',
            'startwink': 'スタ☆トゥインクルプリキュア',
            'hugtto': 'HUGっと！プリキュア',
            'alamode': 'キラキラ☆プリキュアアラモード',
            'princess': 'Go!プリンセスプリキュア',
            'happiness': 'ハピネスチャージプリキュア！',
            'dokidoki': 'ドキドキ！プリキュア',
            'smile': 'スマイルプリキュア！',
            'suite': 'スイートプリキュア♪',
            'heartcatch': 'ハートキャッチプリキュア！',
            'fresh': 'フレッシュプリキュア！',
            'yes5': 'Yes!プリキュア5',
            'futari': 'ふたりはプリキュア',
            'detective': '名探偵プリキュア！',
            'kimi': 'キミとアイドルプリキュア♪',
            'wonderful': 'わんだふるぷりきゅあ！',
            'hirogaru': 'ひろがるスカイ！プリキュア',
            'delicious': 'デリシャスパーティ♡プリキュア',
            'tropical': 'トロピカル～ジュ！プリキュア',
            'rezero': 'Re:ゼロから始める異世界生活',
            'mushoku': '無職転生',
            'sao': 'ソードアート・オンライン'
        };

        function getSubDisplayName(subCode) {
            if (!subCode) return '';
            return subCategoryNames[subCode.trim()] || subCode.trim();
        }

        function cleanUrl(url) {
            if (!url) return '#';
            let cleaned = url.trim();
            cleaned = cleaned.replace(/www\.pictspace\.net/g, 'pictspace.net');
            if (cleaned.includes('pictspace.net') && !cleaned.startsWith('http')) {
                cleaned = 'https://' + cleaned.replace(/^.*?pictspace\.net/, 'pictspace.net');
            }
            return cleaned;
        }

        async function fetchProducts() {
            try {
                const response = await fetch(GAS_URL);
                const rawData = await response.json();
                
                allProducts = rawData.map(p => ({
                    ...p,
                    url: cleanUrl(p.url)
                }));

                document.getElementById('loading').style.display = 'none';
                renderSubCategories('all');
                filterProducts();
            } catch (error) {
                console.error("データの取得に失敗しました:", error);
                document.getElementById('loading').innerText = "データの取得に失敗しました。（スプレッドシートの公開状態やURLを確認してください）";
            }
        }

        function setMainCategory(category) {
            currentMainCategory = category;
            currentSubCategory = 'all';

            document.querySelectorAll('.main-btn').forEach(btn => {
                btn.classList.remove('bg-rose-500', 'text-white');
                btn.classList.add('bg-slate-100', 'text-slate-600');
            });
            event.target.classList.remove('bg-slate-100', 'text-slate-600');
            event.target.classList.add('bg-rose-500', 'text-white');

            renderSubCategories(category);
            filterProducts();
        }

        function renderSubCategories(mainCat) {
            const container = document.getElementById('sub-filter-container');
            container.innerHTML = '';

            let subs = [];
            if (mainCat === 'all') {
                subs = [...new Set(allProducts.map(p => p.sub).filter(s => s && s.trim() !== ''))];
            } else {
                subs = [...new Set(allProducts.filter(p => p.category === mainCat).map(p => p.sub).filter(s => s && s.trim() !== ''))];
            }

            if (subs.length === 0) return;

            let html = `<button onclick="setSubCategory('all')" class="sub-btn active px-3 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-white transition">すべて</button>`;
            
            subs.forEach(sub => {
                const displayName = getSubDisplayName(sub);
                html += `<button onclick="setSubCategory('${sub}')" class="sub-btn px-3 py-1 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition">${displayName}</button>`;
            });

            container.innerHTML = html;
        }

    function setSubCategory(sub) {
            currentSubCategory = sub;
            document.querySelectorAll('.sub-btn').forEach(btn => {
                btn.classList.remove('bg-slate-800', 'text-white');
                btn.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
            });
            event.target.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');
            event.target.classList.add('bg-slate-800', 'text-white');

            filterProducts();
        }

        function filterProducts() {
            const keyword = document.getElementById('search-input').value.toLowerCase();

            const filtered = allProducts.filter(p => {
                const matchMain = (currentMainCategory === 'all' || p.category === currentMainCategory);
                const matchSub = (currentSubCategory === 'all' || p.sub === currentSubCategory);
                const matchKeyword = (!keyword || (p.title && p.title.toLowerCase().includes(keyword)));

                return matchMain && matchSub && matchKeyword;
            });

            renderProducts(filtered);
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            if (products.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-slate-400 py-12">該当する商品が見つかりませんでした。</p>';
                return;
            }

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-slate-200/80 p-5 flex flex-col justify-between hover:shadow-md transition group";
                
                const subDisplay = p.sub ? ' / ' + getSubDisplayName(p.sub) : '';
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">${p.category || 'other'}${subDisplay}</span>
                            <span class="text-xs text-slate-400 font-mono">#${p.id}</span>
                        </div>
                        <h2 class="font-medium text-slate-800 text-xs mb-4 leading-relaxed group-hover:text-rose-600 transition">${p.title}</h2>
                    </div>
                    <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                        <span class="text-rose-600 font-bold text-xs">${p.price || '価格未設定'}</span>
                        <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold bg-rose-500 text-white px-3 py-1.5 rounded-xl hover:bg-rose-600 transition shadow-sm">
                            詳細
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        fetchProducts();
    </script>
</body>
</html>
